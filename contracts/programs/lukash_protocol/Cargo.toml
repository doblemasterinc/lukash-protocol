[package]
name = "lukash_protocol"
version = "0.1.0"
description = "LUKASH Protocol — núcleo económico (fee router, vault, throttle, B0/B2). Milestone 1 (devnet)."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lukash_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
